services:
  island:
    build: .
    restart: unless-stopped
    volumes:
      - island-data:/app/data
    expose:
      - "4174"
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      ISLAND_DOMAIN: ${ISLAND_DOMAIN:?Set the island subdomain in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - island
volumes:
  island-data:
  caddy-data:
  caddy-config:
